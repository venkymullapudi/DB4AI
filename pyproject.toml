[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "db4ai"
version = "1.0.0"
description = "Self-evolving, self-maintaining database for Human+AI company data, with ACID guarantees"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "anthropic>=0.70",
  "mcp>=2.0",
  "pyyaml>=6",
  "pypdf>=5",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
db4ai = "db4ai.cli:main"

[tool.setuptools.packages.find]
include = ["db4ai*"]

[tool.setuptools.package-data]
"db4ai.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
